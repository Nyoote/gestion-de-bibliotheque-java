spring:
  application:
    name: book-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true