spring:
  application:
    name: book-service-test
  cloud:
    bootstrap:
      enabled: false
    config:
      enabled: false
      import-check:
        enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:bookdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

eureka:
  client:
    enabled: false
